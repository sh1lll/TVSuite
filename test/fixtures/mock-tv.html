<script>
(() => {
  const BG = '#131722';
  const bars = [];
  let price = 63000, vol = 1, last = null, symbol = 'BTCUSD';
  function newBar() { const o = price; last = { o, h: o, l: o, c: o }; bars.push(last); if (bars.length > 120) bars.shift(); }
  for (let i = 0; i < 80; i++) { newBar(); for (let k = 0; k < 6; k++) step(); }
  function step() {
    price += (Math.random() - 0.5) * 30 * vol;
    last.c = price; last.h = Math.max(last.h, price); last.l = Math.min(last.l, price);
  }
  const fmt = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function legend() {
    vO.textContent = fmt(last.o); vH.textContent = fmt(last.h); vL.textContent = fmt(last.l); vC.textContent = fmt(last.c);
    document.title = `${symbol} ${fmt(last.c)} ${last.c >= bars[0].o ? '▲' : '▼'} +1.20% Unnamed`;
  }
  function size(c) {
    const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: r.width, h: r.height };
  }
  function paintPane(ctx, w, h) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);               // background fill, as the real chart does
    ctx.strokeStyle = 'rgba(42,46,57,0.6)'; ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 80) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 60) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke(); }
    const lo = Math.min(...bars.map((b) => b.l)), hi = Math.max(...bars.map((b) => b.h));
    const y = (p) => h * 0.9 - ((p - lo) / Math.max(1, hi - lo)) * h * 0.8;
    const bw = (w * 0.7) / bars.length;
    bars.forEach((b, i) => {
      const x = 20 + i * bw;
      ctx.fillStyle = ctx.strokeStyle = b.c >= b.o ? '#089981' : '#f23645';
      ctx.beginPath(); ctx.moveTo(x + bw / 2, y(b.h)); ctx.lineTo(x + bw / 2, y(b.l)); ctx.stroke();
      ctx.fillRect(x + 1, Math.min(y(b.o), y(b.c)), Math.max(1, bw - 2), Math.max(1, Math.abs(y(b.o) - y(b.c))));
    });
  }
  function frame() {
    const m = size(main); paintPane(m.ctx, m.w, m.h);
    const a = size(axis); a.ctx.fillStyle = BG; a.ctx.fillRect(0, 0, a.w, a.h); a.ctx.fillStyle = '#d1d4dc'; a.ctx.fillText(fmt(last.c), 6, 20);

  }
  setInterval(() => { step(); legend(); }, 200);
  setInterval(newBar, 2000);
  legend();
  requestAnimationFrame(frame);
  // Minimal stand-in for TradingView's page API (activeChart().setSymbol / setResolution).
  let resolution = '15';

    price() { return last.c; },
    setPnl(realized, open) { if (realized != null) document.querySelector('[data-field=realized]').textContent = realized; if (open != null) document.querySelector('[data-field=open]').textContent = open; },

      document.body.append(t); setTimeout(() => { t.textContent = text; }, 30); setTimeout(() => t.remove(), 4000);
    },
    setSymbol(sym) {
      document.querySelector('[data-name="legend-source-title"]').textContent = sym;
      document.getElementById('header-toolbar-symbol-search').textContent = sym;

    snapshot() {                                              // detached canvas, like a chart snapshot render
      const c = document.createElement('canvas'); c.width = 400; c.height = 300;
      paintPane(c.getContext('2d'), 400, 300);
      return Array.from(c.getContext('2d').getImageData(395, 5, 1, 1).data);
    },
    pixel(id, fx, fy) {
      const c = document.getElementById(id);
      return Array.from(c.getContext('2d').getImageData(Math.floor(c.width * fx), Math.floor(c.height * fy), 1, 1).data);
    },
  };
